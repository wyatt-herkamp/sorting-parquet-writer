[package]
name = "sorting-parquet-writer"
version = "0.3.0"
edition = "2024"
description = "A Rust library for writing sorted Parquet files using Apache Arrow."
license = "Apache-2.0 OR MIT"
authors = ["Wyatt Herkamp <wherkamp@gmail.com>"]
repository = "https://github.com/wyatt-herkamp/sorting-parquet-writer"
documentation = "https://docs.rs/sorting-parquet-writer"
readme = "README.md"

[dependencies]
arrow = { version = "59", default-features = false }
arrow-schema = "59"
arrow-row = "59"
parquet = { version = "59", features = ["arrow"], default-features = false }
thiserror = "2"

tempfile = "3"
[features]
tests = []

[dev-dependencies]
chrono = "0.4"
anyhow = "1"
tempfile = "3"
rand = "0.10"
arrow = { version = "59", features = ["prettyprint", "chrono-tz"] }
humantime = "2"
criterion = "0.8"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
datafusion = "55"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bench]]
name = "sort_record_batch"
harness = false

[[bench]]
name = "sorting_writer"
harness = false

[[bench]]
name = "datafusion_comparison"
harness = false
